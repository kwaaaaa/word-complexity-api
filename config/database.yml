default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  host: postgres
  port: 5432
  database: word_complexity_development
  username: postgres
  password: postgres

test:
  <<: *default
  host: postgres
  port: 5432
  database: word_complexity_test
  username: postgres
  password: postgres

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>